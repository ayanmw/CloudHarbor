version: '3.8'

services:
  baidu-nas-downloader:
    build: .
    container_name: baidu-nas-downloader
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - BAIDU_ACCESS_TOKEN=${BAIDU_ACCESS_TOKEN}
      - BAIDU_APP_ID=${BAIDU_APP_ID}
      - BAIDU_APP_KEY=${BAIDU_APP_KEY}
      - BAIDU_SECRET_KEY=${BAIDU_SECRET_KEY}
      - QUEUE_DIR=/NAS_Download_Queue
      - LOCAL_DOWNLOAD_DIR=/下载
      - SCAN_INTERVAL=30
      - MAX_PARALLEL=${MAX_PARALLEL:-2}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - RETRY_BACKOFF_SECONDS=${RETRY_BACKOFF_SECONDS:-5}
      - SERVER_PORT=8080
      - SERVER_HOST=0.0.0.0
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
    volumes:
      - ./downloads:/下载
    restart: unless-stopped
