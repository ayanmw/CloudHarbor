version: '3.8'

services:
  baidu-nas-downloader:
    build: .
    container_name: baidu-nas-downloader
    ports:
      - "8080:8080"
    environment:
      - BAIDU_ACCESS_TOKEN=${BAIDU_ACCESS_TOKEN}
      - BAIDU_APP_ID=${BAIDU_APP_ID}
      - BAIDU_APP_KEY=${BAIDU_APP_KEY}
      - BAIDU_SECRET_KEY=${BAIDU_SECRET_KEY}
      - QUEUE_DIR=/NAS_Download_Queue
      - LOCAL_DOWN_DIR=/下载
      - SCAN_INTERVAL=30
      - SERVER_PORT=8080
    volumes:
      - ./downloads:/下载
    restart: unless-stopped