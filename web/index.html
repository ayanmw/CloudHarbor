<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度网盘 NAS 下载监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-card.success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
        }
        
        .stat-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .stat-card.info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .stat-label {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
        }
        
        .tasks-container {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .tasks-header h2 {
            color: #333;
            font-size: 22px;
        }
        
        .refresh-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .refresh-btn:hover {
            transform: translateY(-2px);
        }
        
        .refresh-btn:active {
            transform: translateY(0);
        }
        
        .task-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        
        .task-item.downloading {
            border-left-color: #4facfe;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .task-item.done {
            border-left-color: #38ef7d;
        }
        
        .task-item.failed {
            border-left-color: #f5576c;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        
        .task-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            word-break: break-all;
        }
        
        .task-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .task-info-item {
            font-size: 13px;
            color: #666;
        }
        
        .task-info-item strong {
            color: #333;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.3s ease;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .status-badge.pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-badge.downloading {
            background: #cfe2ff;
            color: #084298;
        }
        
        .status-badge.done {
            background: #d1e7dd;
            color: #0f5132;
        }
        
        .status-badge.failed {
            background: #f8d7da;
            color: #842029;
        }
        
        .error-msg {
            color: #f5576c;
            font-size: 13px;
            margin-top: 8px;
            padding: 8px;
            background: #fff5f5;
            border-radius: 4px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }
        
        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        
        .auto-refresh-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #666;
            margin-left: 15px;
        }
        
        .refresh-dot {
            width: 8px;
            height: 8px;
            background: #38ef7d;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 百度网盘 NAS 自动下载监控</h1>
            <p style="color: #666; margin-top: 10px;">实时监控下载队列状态</p>
            
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">总任务数</div>
                    <div class="stat-value" id="total-tasks">0</div>
                </div>
                <div class="stat-card info">
                    <div class="stat-label">下载中</div>
                    <div class="stat-value" id="downloading-tasks">0</div>
                </div>
                <div class="stat-card success">
                    <div class="stat-label">已完成</div>
                    <div class="stat-value" id="done-tasks">0</div>
                </div>
                <div class="stat-card warning">
                    <div class="stat-label">失败</div>
                    <div class="stat-value" id="failed-tasks">0</div>
                </div>
            </div>
        </div>
        
        <div class="tasks-container">
            <div class="tasks-header">
                <div>
                    <h2>📋 下载任务列表</h2>
                    <div class="sort-controls" style="margin-top: 8px;">
                        <span style="font-size: 13px; color: #666; margin-right: 10px;">排序:</span>
                        <select id="sort-select" onchange="changeSort()" style="font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd;">
                            <option value="name" selected>文件名</option>
                            <option value="progress">下载进度</option>
                            <option value="size">文件大小</option>
                        </select>
                    </div>
                    <span class="auto-refresh-indicator">
                        <span class="refresh-dot"></span>
                        自动刷新（每2秒）
                    </span>
                </div>
                <button class="refresh-btn" onclick="fetchStatus()">🔄 立即刷新</button>
            </div>
            
            <div id="tasks-list">
                <div class="empty-state">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    <p>正在加载任务数据...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // 添加全局变量存储排序方式，默认为文件名排序
        let currentSort = 'name';
        
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function formatSpeed(bytesPerSecond) {
            if (bytesPerSecond === 0) return '0 B/s';
            const k = 1024;
            const sizes = ['B/s', 'KB/s', 'MB/s', 'GB/s'];
            const i = Math.floor(Math.log(bytesPerSecond) / Math.log(k));
            return Math.round(bytesPerSecond / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
        
        function formatTime(timeStr) {
            if (!timeStr) return '—';
            const date = new Date(timeStr);
            return date.toLocaleString('zh-CN', { 
                month: '2-digit', 
                day: '2-digit', 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
        }
        
        function getStatusBadge(status) {
            const statusMap = {
                'pending': '等待中',
                'downloading': '下载中',
                'done': '已完成',
                'failed': '失败'
            };
            return `<span class="status-badge ${status}">${statusMap[status] || status}</span>`;
        }
        
        // 添加排序函数
        function sortTasks(tasks) {
            switch(currentSort) {
                case 'name':
                    return [...tasks].sort((a, b) => {
                        const nameA = (a.path || a.server_filename || '').toLowerCase();
                        const nameB = (b.path || b.server_filename || '').toLowerCase();
                        return nameA.localeCompare(nameB);
                    });
                case 'progress':
                    return [...tasks].sort((a, b) => {
                        const progressA = a.size > 0 ? (a.progress / a.size) : 0;
                        const progressB = b.size > 0 ? (b.progress / b.size) : 0;
                        return progressB - progressA; // 降序排列，进度高的在前
                    });
                case 'size':
                    return [...tasks].sort((a, b) => b.size - a.size); // 降序排列，大的在前
                default:
                    // 默认使用文件名排序
                    return [...tasks].sort((a, b) => {
                        const nameA = (a.path || a.server_filename || '').toLowerCase();
                        const nameB = (b.path || b.server_filename || '').toLowerCase();
                        return nameA.localeCompare(nameB);
                    });
            }
        }
        
        // 添加改变排序方式的函数
        function changeSort() {
            const select = document.getElementById('sort-select');
            currentSort = select.value;
            fetchStatus(); // 重新获取并渲染数据
        }
        
        async function fetchStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                // 更新统计数据
                document.getElementById('total-tasks').textContent = data.tasks.length;
                document.getElementById('downloading-tasks').textContent = 
                    data.tasks.filter(t => t.status === 'downloading').length;
                document.getElementById('done-tasks').textContent = 
                    data.tasks.filter(t => t.status === 'done').length;
                document.getElementById('failed-tasks').textContent = 
                    data.tasks.filter(t => t.status === 'failed').length;
                
                // 更新任务列表
                const tasksList = document.getElementById('tasks-list');
                
                if (data.tasks.length === 0) {
                    tasksList.innerHTML = `
                        <div class="empty-state">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                            </svg>
                            <p>暂无下载任务</p>
                        </div>
                    `;
                    return;
                }
                
                // 对任务进行排序
                const sortedTasks = sortTasks(data.tasks);
                
                tasksList.innerHTML = sortedTasks.map(task => {
                    const progress = task.size > 0 ? (task.progress / task.size * 100) : 0;
                    const progressText = `${formatBytes(task.progress)} / ${formatBytes(task.size)}`;
                    
                    return `
                        <div class="task-item ${task.status}">
                            <div class="task-name">
                                ${getStatusBadge(task.status)}
                                ${task.path || task.server_filename}
                            </div>
                            
                            ${task.status === 'downloading' ? `
                                <div class="progress-bar">
                                    <div class="progress-fill" style="width: ${progress.toFixed(1)}%"></div>
                                </div>
                                <div style="font-size: 13px; color: #666; margin-top: 5px;">
                                    ${progressText} (${progress.toFixed(1)}%)${task.speed ? ` @ ${formatSpeed(task.speed)}` : ''}
                                </div>
                            ` : ''}
                            
                            <div class="task-info">
                                <div class="task-info-item">
                                    <strong>文件大小:</strong> ${formatBytes(task.size)}
                                </div>
                                <div class="task-info-item">
                                    <strong>开始时间:</strong> ${formatTime(task.start_time)}
                                </div>
                                ${task.finish_time ? `
                                    <div class="task-info-item">
                                        <strong>完成时间:</strong> ${formatTime(task.finish_time)}
                                    </div>
                                ` : ''}
                                ${task.local_path ? `
                                    <div class="task-info-item" style="grid-column: 1 / -1;">
                                        <strong>本地路径:</strong> ${task.local_path}
                                    </div>
                                ` : ''}
                            </div>
                            
                            ${task.error ? `
                                <div class="error-msg">❌ ${task.error}</div>
                            ` : ''}
                        </div>
                    `;
                }).join('');
                
            } catch (error) {
                console.error('获取状态失败:', error);
                document.getElementById('tasks-list').innerHTML = `
                    <div class="empty-state">
                        <p style="color: #f5576c;">❌ 获取数据失败，请检查服务是否运行</p>
                    </div>
                `;
            }
        }
        
        // 首次加载
        fetchStatus();
        
        // 每2秒自动刷新
        setInterval(fetchStatus, 2000);
    </script>
</body>
</html>
