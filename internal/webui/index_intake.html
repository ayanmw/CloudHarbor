<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>网盘项目入队</title><link rel="stylesheet" href="/res/shared.css"><style>
body{background:#f4f6fa}.container{max-width:1100px}.intake-card{background:white;border-radius:12px;padding:22px;margin:18px 0}.intake-card h2{font-size:19px;margin:0 0 14px}.intake-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.intake-row input[type=text]{flex:1;min-width:180px}.intake-card input[type=text],textarea{padding:9px;border:1px solid #cbd2df;border-radius:6px;font:inherit}textarea{box-sizing:border-box;width:100%;margin:10px 0}.intake-card button{background:#fff;color:#435dc8;border:1px solid #7385d8;border-radius:6px;padding:8px 12px;cursor:pointer}.intake-card button:disabled{opacity:.45;cursor:default}.muted{font-size:13px;color:#637087;line-height:1.7}.cloud-entry{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid #eef0f4;align-items:center;overflow-wrap:anywhere}.cloud-entry .cloud-name{flex:1;min-width:0}.cloud-entry button{text-align:left}.intake-table{width:100%;border-collapse:collapse;font-size:13px}.intake-table th,.intake-table td{border-bottom:1px solid #e8ebf1;padding:10px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.intake-table td{max-width:340px}.record{border:1px solid #e0e5ef;border-radius:8px;padding:14px;margin:12px 0;overflow:auto}.notice{padding:12px;background:#fff4dc;border-radius:6px;color:#745218;font-size:13px;line-height:1.7}#intake-message{white-space:pre-wrap;line-height:1.7}label{cursor:pointer}
</style></head><body><main class="container">
<nav><a href="/">← 下载任务</a> · <a href="/oauth">百度账号授权</a></nav><h1>将网盘项目加入下载队列</h1>
<p class="muted">选定项目后先预检，再确认移动到固定队列目录。只操作测试副本；移动会改变项目在网盘中的位置。账号状态：<span id="intake-auth">检查中</span></p>
<section class="intake-card"><h2>1. 选择项目</h2>
<form id="cloud-form" class="intake-row"><label for="cloud-directory">云端目录</label><input id="cloud-directory" type="text" value="/" autocomplete="off"><button type="submit">打开目录</button><button type="button" id="cloud-up">上一级</button></form>
<p id="cloud-summary" class="muted"></p><div id="cloud-entries">正在读取目录…</div><div class="intake-row"><button type="button" id="cloud-prev" disabled>上一页</button><button type="button" id="cloud-next" disabled>下一页</button></div>
<label for="intake-paths">已选项目，也可直接输入绝对云路径，每行一项（每批最多 20 项）</label><textarea id="intake-paths" rows="5" placeholder="/我的文件/测试文件.zip"></textarea>
<button type="button" id="intake-preview">预检这些项目</button></section>
<section class="intake-card" id="preview-card" hidden><h2>2. 核对后确认</h2><div id="intake-preview-result"></div><p><label><input type="checkbox" id="intake-confirm-check">我已核对以上源项目、目标目录及后处理策略，确认移动。</label></p><button type="button" id="intake-commit" disabled>确认移动并加入队列</button></section>
<p id="intake-message" role="status" aria-live="polite"></p>
<section class="intake-card"><h2>3. 入队记录</h2><div class="intake-row"><label><input type="checkbox" id="intake-unresolved">只看待核对记录</label><button type="button" id="intake-refresh">刷新记录</button></div><p class="notice">结果未知时不会自动重发移动，对应目标持续隔离。缺少完成凭据的目录不提供人工放行入口，不能仅凭目标根目录出现认定完成。</p><div id="intake-records"></div><div class="intake-row"><button type="button" id="records-prev" disabled>上一页</button><button type="button" id="records-next" disabled>下一页</button></div></section>
</main><script src="/res/shared.js"></script><script src="/res/intake.js"></script></body></html>
