<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自动监控扫描历史</title><link rel="stylesheet" href="/res/shared.css"><style>
body{background:#f4f6fa}.container{max-width:1120px}.card{background:#fff;border-radius:12px;padding:20px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.muted{color:#647087;font-size:13px;line-height:1.6}.message{white-space:pre-wrap;color:#8d3c24}.run{border-top:1px solid #e5e9f2;padding:14px 0;overflow-wrap:anywhere}.events{margin:10px 0 0 18px;padding-left:18px}.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.filters label{display:inline-flex;gap:5px;align-items:center}.run-meta{line-height:1.7}
</style></head><body><main class="container">
<nav><a href="/">← 下载任务</a> · <a href="/cloud">网盘管理</a> · <a href="/oauth">百度账号授权</a> · <button type="button" onclick="logoutAdmin()">退出登录</button></nav>
<section class="card"><h1>自动监控扫描历史</h1><p class="muted">本地 SQLite 记录每轮自动巡检。程序本机时间、百度目录响应观察时间分别显示；中断记录不会推断为成功。本页只读，不会发起百度请求。</p>
<div class="filters"><label>状态 <select id="scan-status"><option value="">全部</option><option value="success">成功</option><option value="failed">失败</option><option value="interrupted">重启时发现中断</option><option value="running">正在运行</option></select></label><label>开始日期 UTC <input id="scan-from" type="date"></label><label>结束日期 UTC <input id="scan-through" type="date"></label><button id="scan-search">查询</button><button id="scan-clear">清除筛选</button><button id="scan-refresh">刷新</button><span id="scan-summary" class="muted">正在读取记录…</span></div>
<div id="scan-list" aria-live="polite"></div><div class="row"><button id="scan-prev" disabled>上一页</button><button id="scan-next" disabled>下一页</button></div><p id="scan-error" class="message" role="status" aria-live="polite"></p></section>
</main><script src="/res/shared.js"></script><script src="/res/monitor_history.js"></script></body></html>
