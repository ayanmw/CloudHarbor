<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>百度网盘 NAS 下载监控 - WebSocket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/res/shared.css">
</head>
<body>
<div class="container">
    <div class="header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h1>📦 百度网盘 NAS 自动下载监控（WebSocket 实时版）</h1>
            <div id="auth-status" style="font-size: 14px;">
                <span id="token-status">Token状态: <span id="token-status-text">检查中...</span></span>
                <a href="/oauth" target="_blank" style="margin-left: 10px; color: #667eea; text-decoration: none;">🔑 OAuth管理</a>
            </div>
        </div>
        <p style="color:#666;margin-top:10px;">实时监控下载队列状态</p>
        <div class="ws-status" id="ws-status">WebSocket 状态：<span>连接中...</span></div>
        <div class="link-poll">如果 WebSocket 不可用，可尝试 <a href="/poll" target="_blank">兼容模式（轮询版）</a></div>
        <div class="settings">
            <strong>下载后处理策略：</strong>
            <label><input type="radio" name="mode" value="keep" checked> 保留网盘文件并标记为 .可删除</label>
            <label><input type="radio" name="mode" value="delete"> 下载完成后删除网盘文件</label>
            <p>设置会保存，只影响以后新加入的根任务；已排队任务保持原策略。</p>
        </div>
        <div style="margin: 8px 0;">
            <span style="font-size: 13px; color: #666; margin-right: 10px;">排序:</span>
            <select id="sort-select" onchange="changeSort()" style="font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="name" selected>文件名</option>
                <option value="progress">下载进度</option>
                <option value="size">文件大小</option>
            </select>
        </div>
        <div class="stats">
            <div class="stat-card"><div class="stat-label">总任务数</div><div class="stat-value" id="total-tasks">0</div></div>
            <div class="stat-card info"><div class="stat-label">下载中</div><div class="stat-value" id="downloading-tasks">0</div></div>
            <div class="stat-card success"><div class="stat-label">已完成</div><div class="stat-value" id="done-tasks">0</div></div>
            <div class="stat-card warning"><div class="stat-label">失败</div><div class="stat-value" id="failed-tasks">0</div></div>
        </div>
    </div>
    <div class="tasks-container">
        <div class="tasks-header">
            <h2>📋 下载任务列表</h2>
        </div>
        <div id="tasks-list" class="empty-state">正在等待任务...</div>
    </div>
</div>
<script src="/res/shared.js"></script>
<script>
    let ws;
    let currentMode = 'keep';
    // 添加全局变量存储排序方式，默认为文件名排序
    let currentSort = 'name';
    
    // 添加改变排序方式的函数
    function changeSort() {
        const select = document.getElementById('sort-select');
        currentSort = select.value;
    }

    // 检查 Token 状态
    async function checkTokenStatus() {
        try {
            const response = await fetch('/api/health');
            if (response.ok) {
                const data = await response.json();
                // 如果 health 接口能正常返回，说明服务正常运行
                document.getElementById('token-status-text').textContent = '已连接';
                document.getElementById('token-status-text').style.color = '#0f5132';
            } else {
                document.getElementById('token-status-text').textContent = '连接异常';
                document.getElementById('token-status-text').style.color = '#842029';
            }
        } catch (error) {
            document.getElementById('token-status-text').textContent = '无法连接';
            document.getElementById('token-status-text').style.color = '#842029';
        }
    }

    function renderTasks(data) {
        const tasks = data.tasks || [];
        
        // 对任务进行排序
        const sortedTasks = sortTasks(tasks, currentSort);
        
        document.getElementById('total-tasks').textContent = sortedTasks.length;
        document.getElementById('downloading-tasks').textContent = sortedTasks.filter(t=>t.status==='downloading').length;
        document.getElementById('done-tasks').textContent = sortedTasks.filter(t=>t.status==='done').length;
        document.getElementById('failed-tasks').textContent = sortedTasks.filter(t=>t.status==='failed').length;

        const list = document.getElementById('tasks-list');
        if (sortedTasks.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无任务</div>';
            return;
        }
        list.innerHTML = sortedTasks.map(t => {
            const progress = t.size > 0 ? (t.progress / t.size * 100) : 0;
            const progressText = `${formatBytes(t.progress)} / ${formatBytes(t.size)}`;
            return `
<div class="task-item ${t.status}">
  <div class="task-name">${getStatusBadge(t.status)} ${t.path || t.server_filename}</div>
  ${t.status === 'downloading' ? `
  <div class="progress-bar"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
  <div style="font-size:13px;color:#666;margin-top:5px;">${progressText} (${progress.toFixed(1)}%)${t.speed ? ` @ ${formatSpeed(t.speed)}` : ''}</div>
  ` : ''}
  <div class="task-info">
    <div class="task-info-item"><strong>文件大小:</strong> ${formatBytes(t.size)}</div>
    <div class="task-info-item"><strong>开始时间:</strong> ${formatTime(t.start_time)}</div>
    ${t.finish_time ? `<div class="task-info-item"><strong>完成时间:</strong> ${formatTime(t.finish_time)}</div>` : ''}
    ${t.local_path ? `<div class="task-info-item" style="grid-column:1/-1;"><strong>本地路径:</strong> ${t.local_path}</div>` : ''}
  </div>
  ${t.error ? `<div class="error-msg">❌ ${t.error}</div>` : ''}
</div>`;
        }).join('');
    }

    function applySettings(settings) {
        if (!settings) return;
        if (settings.download_mode) {
            currentMode = settings.download_mode;
            const radios = document.querySelectorAll('input[name="mode"]');
            radios.forEach(r => {
                r.checked = (r.value === currentMode);
            });
        }
    }

    function connectWS() {
        const statusEl = document.getElementById('ws-status').querySelector('span');
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(proto + '//' + location.host + '/ws');

        ws.onopen = () => {
            statusEl.textContent = '已连接';
            statusEl.style.color = '#0f5132';
            // WebSocket 连接成功后检查 Token 状态
            checkTokenStatus();
        };
        ws.onclose = () => {
            statusEl.textContent = '已断开，3秒后重连...';
            statusEl.style.color = '#842029';
            setTimeout(connectWS, 3000);
        };
        ws.onerror = () => {
            statusEl.textContent = '发生错误';
            statusEl.style.color = '#842029';
        };
        ws.onmessage = (evt) => {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'status') {
                renderTasks(msg);
                applySettings(msg.settings);
            }
        };
    }

    function sendMode(mode) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
            type: 'update_settings',
            download_mode: mode
        }));
    }

    document.addEventListener('DOMContentLoaded', () => {
        connectWS();
        document.querySelectorAll('input[name="mode"]').forEach(r => {
            r.addEventListener('change', () => {
                if (r.checked) {
                    currentMode = r.value;
                    sendMode(currentMode);
                }
            });
        });
    });
</script>
</body>
</html>
