<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>百度网盘 NAS 下载监控 - WebSocket</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 样式与之前 index.html 基本一致，这里省略部分注释 -->
    <style>
        /* 这里直接复用你当前 index.html 的样式，为节省篇幅就不重复粘贴全部注释 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { background: white; border-radius: 12px; padding: 30px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .header h1 { color: #333; font-size: 28px; margin-bottom: 10px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 8px; text-align: center; }
        .stat-card.success { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); }
        .stat-card.warning { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .stat-card.info { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .stat-label { font-size: 14px; opacity: 0.9; margin-bottom: 5px; }
        .stat-value { font-size: 32px; font-weight: bold; }
        .tasks-container { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .tasks-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .tasks-header h2 { color: #333; font-size: 22px; }
        .task-item { background: #f8f9fa; border-radius: 8px; padding: 20px; margin-bottom: 15px; border-left: 4px solid #667eea; }
        .task-item.downloading { border-left-color: #4facfe; animation: pulse 2s ease-in-out infinite; }
        .task-item.done { border-left-color: #38ef7d; }
        .task-item.failed { border-left-color: #f5576c; }
        @keyframes pulse { 0%,100%{opacity:1;}50%{opacity:0.8;} }
        .task-name { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 10px; word-break: break-all; }
        .task-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 10px; }
        .task-info-item { font-size: 13px; color: #666; }
        .task-info-item strong { color: #333; }
        .progress-bar { width: 100%; height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%); transition: width 0.3s ease; }
        .status-badge { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .status-badge.pending { background: #fff3cd; color: #856404; }
        .status-badge.downloading { background: #cfe2ff; color: #084298; }
        .status-badge.done { background: #d1e7dd; color: #0f5132; }
        .status-badge.failed { background: #f8d7da; color: #842029; }
        .error-msg { color: #f5576c; font-size: 13px; margin-top: 8px; padding: 8px; background: #fff5f5; border-radius: 4px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #999; }
        .settings { margin-top: 15px; font-size: 14px; color: #444; }
        .settings label { margin-right: 15px; cursor: pointer; }
        .link-poll { font-size: 13px; color: #555; margin-top: 8px; }
        .link-poll a { color: #667eea; text-decoration: none; }
        .link-poll a:hover { text-decoration: underline; }
        .ws-status { font-size: 13px; color: #666; margin-top: 5px; }
        .ws-status span { font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📦 百度网盘 NAS 自动下载监控（WebSocket 实时版）</h1>
        <p style="color:#666;margin-top:10px;">实时监控下载队列状态</p>
        <div class="ws-status" id="ws-status">WebSocket 状态：<span>连接中...</span></div>
        <div class="link-poll">如果 WebSocket 不可用，可尝试 <a href="/poll" target="_blank">兼容模式（轮询版）</a></div>
        <div class="settings">
            <strong>下载后处理策略：</strong>
            <label><input type="radio" name="mode" value="keep" checked> 保留网盘文件并标记为 .可删除</label>
            <label><input type="radio" name="mode" value="delete"> 下载完成后删除网盘文件</label>
        </div>
        <div style="margin: 8px 0;">
            <span style="font-size: 13px; color: #666; margin-right: 10px;">排序:</span>
            <select id="sort-select" onchange="changeSort()" style="font-size: 12px; padding: 2px 6px; border-radius: 4px; border: 1px solid #ddd;">
                <option value="name" selected>文件名</option>
                <option value="progress">下载进度</option>
                <option value="size">文件大小</option>
            </select>
        </div>
        <div class="stats">
            <div class="stat-card"><div class="stat-label">总任务数</div><div class="stat-value" id="total-tasks">0</div></div>
            <div class="stat-card info"><div class="stat-label">下载中</div><div class="stat-value" id="downloading-tasks">0</div></div>
            <div class="stat-card success"><div class="stat-label">已完成</div><div class="stat-value" id="done-tasks">0</div></div>
            <div class="stat-card warning"><div class="stat-label">失败</div><div class="stat-value" id="failed-tasks">0</div></div>
        </div>
    </div>
    <div class="tasks-container">
        <div class="tasks-header">
            <h2>📋 下载任务列表</h2>
        </div>
        <div id="tasks-list" class="empty-state">正在等待任务...</div>
    </div>
</div>
<script>
    let ws;
    let currentMode = 'keep';
    // 添加全局变量存储排序方式，默认为文件名排序
    let currentSort = 'name';
    
    function formatBytes(bytes) {
        if (bytes === 0) return '0 B';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    function formatTime(str) {
        if (!str) return '—';
        const d = new Date(str);
        return d.toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }

    function getStatusBadge(status) {
        const map = {pending:'等待中',downloading:'下载中',done:'已完成',failed:'失败'};
        return `<span class="status-badge ${status}">${map[status] || status}</span>`;
    }
    
    // 添加排序函数
    function sortTasks(tasks) {
        switch(currentSort) {
            case 'name':
                return [...tasks].sort((a, b) => {
                    const nameA = (a.path || a.server_filename || '').toLowerCase();
                    const nameB = (b.path || b.server_filename || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });
            case 'progress':
                return [...tasks].sort((a, b) => {
                    const progressA = a.size > 0 ? (a.progress / a.size) : 0;
                    const progressB = b.size > 0 ? (b.progress / b.size) : 0;
                    return progressB - progressA; // 降序排列，进度高的在前
                });
            case 'size':
                return [...tasks].sort((a, b) => b.size - a.size); // 降序排列，大的在前
            default:
                // 默认使用文件名排序
                return [...tasks].sort((a, b) => {
                    const nameA = (a.path || a.server_filename || '').toLowerCase();
                    const nameB = (b.path || b.server_filename || '').toLowerCase();
                    return nameA.localeCompare(nameB);
                });
        }
    }
    
    // 添加改变排序方式的函数
    function changeSort() {
        const select = document.getElementById('sort-select');
        currentSort = select.value;
    }

    function renderTasks(data) {
        const tasks = data.tasks || [];
        
        // 对任务进行排序
        const sortedTasks = sortTasks(tasks);
        
        document.getElementById('total-tasks').textContent = sortedTasks.length;
        document.getElementById('downloading-tasks').textContent = sortedTasks.filter(t=>t.status==='downloading').length;
        document.getElementById('done-tasks').textContent = sortedTasks.filter(t=>t.status==='done').length;
        document.getElementById('failed-tasks').textContent = sortedTasks.filter(t=>t.status==='failed').length;

        const list = document.getElementById('tasks-list');
        if (sortedTasks.length === 0) {
            list.innerHTML = '<div class="empty-state">暂无任务</div>';
            return;
        }
        list.innerHTML = sortedTasks.map(t => {
            const progress = t.size > 0 ? (t.progress / t.size * 100) : 0;
            const progressText = `${formatBytes(t.progress)} / ${formatBytes(t.size)}`;
            return `
<div class="task-item ${t.status}">
  <div class="task-name">${getStatusBadge(t.status)} ${t.path || t.server_filename}</div>
  ${t.status === 'downloading' ? `
  <div class="progress-bar"><div class="progress-fill" style="width:${progress.toFixed(1)}%"></div></div>
  <div style="font-size:13px;color:#666;margin-top:5px;">${progressText} (${progress.toFixed(1)}%)</div>
  ` : ''}
  <div class="task-info">
    <div class="task-info-item"><strong>文件大小:</strong> ${formatBytes(t.size)}</div>
    <div class="task-info-item"><strong>开始时间:</strong> ${formatTime(t.start_time)}</div>
    ${t.finish_time ? `<div class="task-info-item"><strong>完成时间:</strong> ${formatTime(t.finish_time)}</div>` : ''}
    ${t.local_path ? `<div class="task-info-item" style="grid-column:1/-1;"><strong>本地路径:</strong> ${t.local_path}</div>` : ''}
  </div>
  ${t.error ? `<div class="error-msg">❌ ${t.error}</div>` : ''}
</div>`;
        }).join('');
    }

    function applySettings(settings) {
        if (!settings) return;
        if (settings.download_mode) {
            currentMode = settings.download_mode;
            const radios = document.querySelectorAll('input[name="mode"]');
            radios.forEach(r => {
                r.checked = (r.value === currentMode);
            });
        }
    }

    function connectWS() {
        const statusEl = document.getElementById('ws-status').querySelector('span');
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(proto + '//' + location.host + '/ws');

        ws.onopen = () => {
            statusEl.textContent = '已连接';
            statusEl.style.color = '#0f5132';
        };
        ws.onclose = () => {
            statusEl.textContent = '已断开，3秒后重连...';
            statusEl.style.color = '#842029';
            setTimeout(connectWS, 3000);
        };
        ws.onerror = () => {
            statusEl.textContent = '发生错误';
            statusEl.style.color = '#842029';
        };
        ws.onmessage = (evt) => {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'status') {
                renderTasks(msg);
                applySettings(msg.settings);
            }
        };
    }

    function sendMode(mode) {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
            type: 'update_settings',
            download_mode: mode
        }));
    }

    document.addEventListener('DOMContentLoaded', () => {
        connectWS();
        document.querySelectorAll('input[name="mode"]').forEach(r => {
            r.addEventListener('change', () => {
                if (r.checked) {
                    currentMode = r.value;
                    sendMode(currentMode);
                }
            });
        });
    });
</script>
</body>
</html>
