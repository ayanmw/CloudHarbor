<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>远端操作历史</title><link rel="stylesheet" href="/res/shared.css"><style>
body{background:#f4f6fa}.container{max-width:1120px}.card{background:#fff;border-radius:12px;padding:20px;margin:18px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row input{min-width:220px;flex:1}.muted{color:#647087;font-size:13px;line-height:1.6}.message{white-space:pre-wrap;color:#8d3c24}.operation-history-entry{overflow-wrap:anywhere}.operation-event-filter{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}.operation-event-filter label{display:inline-flex;align-items:center;gap:5px}.operation-event-filter input[type=date]{min-width:140px}
</style></head><body><main class="container">
<nav><a href="/cloud">← 网盘管理</a> · <a href="/">下载任务</a> · <a href="/oauth">百度账号授权</a> · <button type="button" onclick="logoutAdmin()">退出登录</button></nav>
<section class="card" id="remote-operation-history"><h1>远端操作历史（只读）</h1><p class="muted">记录来自本地 SQLite，不请求百度网盘。结果未知的操作保持隔离；此页不提供重发、放行或删除记录。</p><details id="remote-operation-details" open><summary>操作记录与筛选</summary><div class="row"><label for="remote-operation-query">关键字</label><input id="remote-operation-query" type="search" maxlength="128" placeholder="操作 ID、fs_id 或网盘路径"><label for="remote-operation-from">起始时间（本地）</label><input id="remote-operation-from" type="datetime-local"><label for="remote-operation-to">结束时间（本地）</label><input id="remote-operation-to" type="datetime-local"></div><div class="row"><label for="remote-operation-status">状态</label><select id="remote-operation-status"><option value="">全部</option><option value="prepared">待确认</option><option value="confirmed">已确认</option><option value="unknown">结果未知（隔离）</option><option value="failed">失败</option></select><label for="remote-operation-kind">操作类型</label><select id="remote-operation-kind"><option value="">全部类型</option><option value="mkdir">新建目录</option><option value="move">移动</option><option value="rename">重命名</option><option value="delete">删除</option></select><button type="button" id="remote-operation-search">搜索</button><button type="button" id="remote-operation-clear">清空筛选</button><button type="button" id="remote-operation-export">导出筛选摘要 JSON</button><button type="button" id="remote-operation-refresh">刷新历史</button><span id="remote-operation-summary" class="muted">正在读取本地操作历史…</span></div><div id="remote-operation-list"></div><div class="row"><button type="button" id="remote-operation-prev" disabled>上一页</button><button type="button" id="remote-operation-next" disabled>下一页</button></div><p id="remote-operation-error" class="message" role="status" aria-live="polite"></p></details></section>
</main><script src="/res/shared.js"></script><script>const autoLoadRemoteOperationHistory=true;</script><script src="/res/cloud_operations.js"></script></body></html>
