<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>百度账号授权</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f6fa;color:#243047;margin:0;padding:32px 16px}.container{max-width:720px;margin:auto}a{color:#2465d7}.card{background:white;border-radius:12px;padding:24px;margin:20px 0;box-shadow:0 3px 18px #2030520d}h1{font-size:26px}h2{font-size:18px}button{padding:10px 16px;border:0;border-radius:6px;background:#2465d7;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.5;cursor:wait}.muted{color:#647087;font-size:14px;line-height:1.7}#message{white-space:pre-wrap;line-height:1.7}#qr{max-width:220px;display:block;margin:16px 0}code{font-size:22px;letter-spacing:3px}dl{display:grid;grid-template-columns:120px 1fr;gap:10px}dd{margin:0;overflow-wrap:anywhere}
</style>
<script src="/res/shared.js"></script>
</head>
<body><main class="container">
<a href="/">← 返回下载任务</a><h1>百度账号授权</h1>
<p class="muted">管理员登录保护本工具，百度授权允许工具访问网盘。授权成功后，凭证会保存到当前下载目录并应用于后台任务。</p>
<section class="card"><h2>账号状态</h2><dl><dt>当前状态</dt><dd id="state">检查中</dd><dt>凭证到期</dt><dd id="expiry">—</dd><dt>自动续期</dt><dd id="renewal">—</dd><dt>最近错误</dt><dd id="error">—</dd></dl><button id="refresh" onclick="refreshCredential()">立即续期</button></section>
<section class="card"><h2>授权或重新授权</h2><p class="muted">网页授权需要启动时设置 BAIDU_APP_KEY 和 BAIDU_SECRET_KEY。同一下载目录绑定一个百度账号，更换账号请使用新的下载目录。</p>
<button id="device" onclick="getDeviceCode()">获取授权码</button>
<div id="authorization" hidden><p>授权码：<code id="user-code"></code></p><img id="qr" alt="百度授权二维码" hidden><p><a id="auth-link" target="_blank" rel="noopener noreferrer">打开百度授权页面</a></p><p class="muted" id="deadline"></p><button id="poll" onclick="applyAuthorization()">已完成百度授权，开始验证</button><button id="cancel" onclick="cancelPolling()" disabled>停止等待</button></div>
<p id="message" role="status"></p></section>
<p class="muted">页面只显示授权状态。后台会保存 Access Token / Refresh Token；请妥善保护下载目录及其备份，不要发送其中的凭证文件。</p>
</main>
<script>
let deviceCode = null;
let polling = null;
function safeBaiduURL(value) {
    try { const u = new URL(value); return u.protocol === 'https:' && !u.username && !u.password && (u.hostname === 'baidu.com' || u.hostname.endsWith('.baidu.com')) ? u.href : ''; } catch { return ''; }
}
function message(text) { document.getElementById('message').textContent = text; }
async function request(path, body, signal) {
    const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body || {}), signal});
    if (!response.ok) throw new Error(await response.text());
    return response.json();
}
async function updateStatus() {
    try {
        const response = await fetch('/api/oauth/status'); if (!response.ok) throw new Error('状态查询失败');
        const auth = await response.json();
        document.getElementById('state').textContent = credentialStatusText(auth);
        document.getElementById('expiry').textContent = auth.expires_at ? new Date(auth.expires_at).toLocaleString() : '未知';
        document.getElementById('renewal').textContent = auth.can_refresh ? (auth.next_attempt ? '等待重试：'+new Date(auth.next_attempt).toLocaleString() : '已配置') : '未配置或需要重新授权';
        document.getElementById('error').textContent = auth.last_error || '—';
        document.getElementById('refresh').disabled = !auth.can_refresh;
    } catch (error) { document.getElementById('state').textContent = '无法读取状态'; }
}
function cancelPolling() { if (polling) polling.abort(); }
async function getDeviceCode() {
    cancelPolling(); deviceCode = null; document.getElementById('authorization').hidden = true;
    const button = document.getElementById('device'); button.disabled = true; message('正在获取授权码…');
    try {
        const data = await request('/api/oauth/device-code'); deviceCode = data.device_code;
        document.getElementById('user-code').textContent = data.user_code;
        document.getElementById('deadline').textContent = '有效期 '+data.expires_in+' 秒。完成百度授权后点击下方按钮，轮询间隔由服务端控制。';
        const qr = document.getElementById('qr'); const qrURL = safeBaiduURL(data.qrcode_url); qr.hidden = !qrURL; if (qrURL) qr.src = qrURL;
        const link = document.getElementById('auth-link'); const authURL = safeBaiduURL(data.verification_url); link.hidden = !authURL; if (authURL) link.href = authURL;
        document.getElementById('authorization').hidden = false; message('请使用需要下载的百度账号完成授权。');
    } catch (error) { message(error.message); } finally { button.disabled = false; }
}
async function applyAuthorization() {
    if (!deviceCode || polling) return;
    const controller = new AbortController(); polling = controller;
    document.getElementById('poll').disabled = true; document.getElementById('cancel').disabled = false;
    message('等待百度授权并验证账号，可能需要一段时间…');
    try { await request('/api/oauth/token', {device_code:deviceCode}, controller.signal); deviceCode = null; document.getElementById('authorization').hidden = true; message('授权已验证并保存，后台将重新扫描并恢复任务。'); }
    catch (error) { message(error.name === 'AbortError' ? '已停止本次等待。' : error.message); }
    finally { if (polling === controller) { polling = null; document.getElementById('poll').disabled = false; document.getElementById('cancel').disabled = true; } updateStatus(); }
}
async function refreshCredential() {
    const button = document.getElementById('refresh'); button.disabled = true; message('正在续期并保存凭证…');
    try { await request('/api/oauth/refresh'); message('续期完成，后台将重新扫描任务。'); } catch (error) { message(error.message); } finally { updateStatus(); }
}
updateStatus(); setInterval(updateStatus, 5000);
</script></body></html>
