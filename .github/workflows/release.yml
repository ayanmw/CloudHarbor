name: CloudHarbor Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: Validate release identity
        shell: pwsh
        run: |
          $version = (Get-Content release/current-version.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid version manifest' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $version) { throw 'Tag and active version must match' }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Build, test and package three platforms
        shell: pwsh
        run: |
          # Vite regenerates embedded assets; the package records their exact snapshot.
          ./scripts/package.ps1 -Version $env:RELEASE_VERSION -AllowDirty -OutputRoot "$env:RUNNER_TEMP/cloudharbor-release"
          Copy-Item "$env:RUNNER_TEMP/cloudharbor-release/$env:RELEASE_VERSION.zip" "CloudHarbor-$env:RELEASE_VERSION.zip"
          $hash = (Get-FileHash "CloudHarbor-$env:RELEASE_VERSION.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CloudHarbor-$env:RELEASE_VERSION.zip" | Set-Content SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload testable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CloudHarbor-${{ env.RELEASE_VERSION }}
          path: |
            CloudHarbor-${{ env.RELEASE_VERSION }}.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep partial uploads hidden; a failed run can safely retry the same draft.
          $tag = $env:RELEASE_VERSION
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw 'Published releases are immutable; review before replacing assets' }
          } else {
            gh release create $tag --verify-tag --draft --title "泊云 CloudHarbor $tag" --notes-file "docs/releases/$tag.zh-CN.md"
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create draft release' }
          }
          gh release upload $tag "CloudHarbor-$tag.zip" SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Cannot upload release assets' }
          $release = gh release view $tag --json assets | ConvertFrom-Json
          foreach ($name in @("CloudHarbor-$tag.zip", 'SHA256SUMS.txt')) {
            if (!($release.assets | Where-Object { $_.name -eq $name -and $_.size -gt 0 })) { throw "Missing release asset: $name" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Cannot publish release' }
